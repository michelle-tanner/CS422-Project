<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Catalog — MySkindex</title>
  <link rel="stylesheet" href="../index.css" />
  <!-- filter-lists.js must load before pill.js (creates the FilterLists global) -->
  <script src="../data/filter-lists.js" defer></script>
  <script src="../components/pill.js" defer></script>
  <script src="../components/header.js" defer></script>
  <script src="../components/footer.js" defer></script>
  <script src="../components/breadcrumb.js" defer></script>
  <script src="../components/product-card.js" defer></script>
</head>
<body class="main-scroll">

  <my-header no-search></my-header>
  <my-breadcrumb current="catalog"></my-breadcrumb>

  <main>
    <div class="catalog-layout">

      <!-- Sidebar -->
      <aside class="catalog-sidebar">
        <!-- Reminder of the chosen skin concern(s) and the functions that help them
             (filled in by renderChoicesSummary()). It does NOT filter anything by itself. -->
        <div class="sidebar-summary" id="choices-summary"></div>

        <!-- Include -->
        <div class="sidebar-block">
          <h2 class="sidebar-heading">Include Ingredients</h2>
          <hr class="sidebar-divider" />
          <div class="ingredient-search-wrap">
            <div class="sidebar-search include-search">
              <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
              <input
                id="include-input"
                type="text"
                placeholder="search ingredient"
                aria-label="Include ingredient"
                autocomplete="off"
              />
            </div>
            <ul class="ingredient-dropdown" id="include-dropdown" hidden></ul>
          </div>
          <div class="ingredient-pills" id="include-pills"></div>
        </div>

        <!-- Exclude -->
        <div class="sidebar-block">
          <h2 class="sidebar-heading">Exclude Ingredients</h2>
          <hr class="sidebar-divider" />
          <div class="ingredient-search-wrap">
            <div class="sidebar-search exclude-search">
              <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
              <input
                id="exclude-input"
                type="text"
                placeholder="search ingredient"
                aria-label="Exclude ingredient"
                autocomplete="off"
              />
            </div>
            <ul class="ingredient-dropdown" id="exclude-dropdown" hidden></ul>
          </div>
          <div class="ingredient-pills" id="exclude-pills"></div>
        </div>
      </aside>

      <!-- Drag to resize the sidebar (double-click to reset). Arrow keys work when focused. -->
      <div
        class="sidebar-resizer"
        id="sidebar-resizer"
        role="separator"
        aria-orientation="vertical"
        aria-label="Resize sidebar"
        tabindex="0"
        title="Drag to resize, double-click to reset"
      ></div>

      <!-- Right side: filter bar on top, products underneath -->
      <div class="catalog-main">

        <!-- Filter bar: each filter is a dropdown button; more filters can be added here -->
        <div class="filter-bar">
          <!-- Left group: dropdown buttons, with the chosen-filter chips underneath -->
          <div class="filter-bar-filters">
          <div class="filter-buttons">
          <details class="filter-dropdown" id="concerns-accordion">
            <summary>Concerns <span class="filter-count" id="concerns-count" hidden></span></summary>
            <ul class="accordion-list" id="concerns-list"></ul>
          </details>
          <details class="filter-dropdown" id="functions-accordion">
            <summary>Functions <span class="filter-count" id="functions-count" hidden></span></summary>
            <ul class="accordion-list" id="functions-list"></ul>
          </details>
          </div>

          <!-- Chosen Concerns / Functions, each with an × to remove it without opening the dropdown.
               Filled in by renderActiveFilters(); hidden while nothing is chosen. -->
          <div class="active-filters" id="active-filters" hidden></div>
          </div>

          <!-- Right group: product search -->
          <div class="sidebar-search product-search">
            <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
            <input type="text" placeholder="search product" aria-label="Search product" />
          </div>
        </div>

        <!-- Product Grid -->
        <section class="product-grid" id="product-grid"></section>
      </div>

    </div>
  </main>

</body>
</html>

<script type="module">
  const INGREDIENTS_URL = "../data/ingredients.json";
  const PRODUCTS_URL    = "../data/products.json";
  const FUNCTIONS_URL   = "../data/functions.json";
  const CONCERNS_URL    = "../data/concerns.json";

  const [ingredientsData, productsData, functionsData, concernsData] = await Promise.all([
    fetch(INGREDIENTS_URL).then(r => r.json()),
    fetch(PRODUCTS_URL).then(r => r.json()),
    fetch(FUNCTIONS_URL).then(r => r.json()),
    fetch(CONCERNS_URL).then(r => r.json()),
  ]);

  const allIngredientNames = ingredientsData.map(i => i.name);

  /* Search query (URL param or live sidebar input) */
  let searchQuery = (new URLSearchParams(window.location.search).get("q") || "").trim().toLowerCase();

  const productSearchInput = document.querySelector(".product-search input");
  productSearchInput.value = searchQuery; // pre-fill from URL if present
  productSearchInput.addEventListener("input", () => {
    searchQuery = productSearchInput.value.trim().toLowerCase();
    filterProducts();
  });

  /* Selected filter state: starts with the concerns and functions saved in localStorage
     (selectedConcerns / selectedFunctions), so those boxes are already checked when the catalog opens.
     Every checkbox change is saved back, so a refresh keeps the same boxes checked. */
  const functionLabels    = new Set(functionsData.map(fn => fn.label));
  const selectedFunctions = new Set(FilterLists.getSelectedFunctions().filter(f => functionLabels.has(f)));
  const selectedConcerns  = new Set(FilterLists.getSelectedConcerns().filter(c => c in concernsData.concerns)); // e.g. "acne"

  /* Filter + render product grid */
  const grid = document.getElementById("product-grid");

  function renderGrid(products) {
    grid.innerHTML = "";
    products.forEach(product => {
      const card = document.createElement("product-card");
      card.setAttribute("name", product.name);
      card.setAttribute("description", product.type ?? "");
      if (product.image) card.setAttribute("image", product.image);
      grid.appendChild(card);
    });
  }

  function filterProducts() {
    const includeIngreds = FilterLists.getInclude().map(n => n.trim().toLowerCase());
    const fns            = [...selectedFunctions].map(f => f.toLowerCase());

    const filtered = productsData.filter(product => {
      const ingreds = (product.ingreds   || []).map(i => i.toLowerCase());
      const funcs   = (product.functions || []).map(f => f.toLowerCase());

      // Name must match the search query
      if (searchQuery && !product.name.toLowerCase().includes(searchQuery)) return false;

      // Every selected include ingredient must appear in the product
      if (includeIngreds.length && !includeIngreds.every(i => ingreds.includes(i))) return false;

      // No excluded ingredient may appear in the product
      const excludeIngreds = FilterLists.getExclude().map(n => n.trim().toLowerCase());
      if (excludeIngreds.length && excludeIngreds.some(i => ingreds.includes(i))) return false;

      // Every selected function must appear in the product
      if (fns.length && !fns.every(f => funcs.includes(f))) return false;

      // For every selected concern, product must have at least one of that concern's "Go For" functions
      for (const key of selectedConcerns) {
        const concern = concernsData.concerns[key];
        const gofor   = (concern.gofor || []).filter(Boolean).map(g => g.toLowerCase());
        if (gofor.length && !gofor.some(g => funcs.includes(g))) return false;
      }

      return true;
    });

    renderGrid(filtered);
  }

  filterProducts(); // first render, using any Include/Exclude choices already saved in localStorage

  /* Render include / exclude pill sections from FilterLists.
     "removable" makes each pill show a single × button (clears it from the list)
     instead of the include / exclude pair. */
  function renderPills() {
    const includePillsEl = document.getElementById("include-pills");
    const excludePillsEl = document.getElementById("exclude-pills");

    includePillsEl.innerHTML = "";
    FilterLists.getInclude().forEach(name => {
      const pill = document.createElement("ingredient-pill");
      pill.setAttribute("label", name);
      pill.setAttribute("removable", "");
      includePillsEl.appendChild(pill);
    });

    excludePillsEl.innerHTML = "";
    FilterLists.getExclude().forEach(name => {
      const pill = document.createElement("ingredient-pill");
      pill.setAttribute("label", name);
      pill.setAttribute("removable", "");
      excludePillsEl.appendChild(pill);
    });
  }

  // Pill change → update pill display + re-filter
  window.addEventListener("filter-lists-change", () => {
    renderPills();
    filterProducts();
  });
  renderPills();

  /* Ingredient search dropdowns */
  function setupIngredientSearch({ inputId, dropdownId, status }) {
    const input    = document.getElementById(inputId);
    const dropdown = document.getElementById(dropdownId);

    function renderDropdown(query) {
      const q = query.trim().toLowerCase();
      if (!q) { dropdown.hidden = true; return; }

      const matches = allIngredientNames
        .filter(name => name.toLowerCase().includes(q) && FilterLists.getStatus(name) !== status)
        .slice(0, 10);

      if (!matches.length) { dropdown.hidden = true; return; }

      dropdown.innerHTML = "";
      matches.forEach(name => {
        const li = document.createElement("li");
        li.textContent = name;
        li.addEventListener("mousedown", e => {
          e.preventDefault();
          FilterLists.setStatus(name, status);
          input.value = "";
          dropdown.hidden = true;
        });
        dropdown.appendChild(li);
      });
      dropdown.hidden = false;
    }

    input.addEventListener("input",  () => renderDropdown(input.value));
    input.addEventListener("focus",  () => renderDropdown(input.value));
    input.addEventListener("blur",   () => { dropdown.hidden = true; });
  }

  setupIngredientSearch({ inputId: "include-input", dropdownId: "include-dropdown", status: "check" });
  setupIngredientSearch({ inputId: "exclude-input", dropdownId: "exclude-dropdown", status: "x" });

  /* Accordion lists: one checkbox per option */
  // `selected` = the Set holding the checked keys, so saved choices start checked.
  // Returns a Map of key -> { label, checkbox, onSelect } so the chips below can uncheck a box.
  function buildSelectableList(containerEl, items, selected) {
    const options = new Map();
    items.forEach(({ label, key, onSelect }) => {
      const li = document.createElement("li");
      const row = document.createElement("label"); // clicking the text also ticks the box
      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = selected.has(key);
      const text = document.createElement("span");
      // <wbr> after each "/" lets "moisturizer/humectant" wrap after the slash instead of mid-word
      label.split("/").forEach((part, i) => {
        if (i > 0) text.append("/", document.createElement("wbr"));
        text.append(part);
      });

      checkbox.addEventListener("change", () => {
        onSelect(key, checkbox.checked);
        filterProducts();
        renderActiveFilters();
      });

      row.append(checkbox, text);
      li.appendChild(row);
      containerEl.appendChild(li);
      options.set(key, { label, checkbox, onSelect });
    });
    return options;
  }

  const concernOptions = buildSelectableList(
    document.getElementById("concerns-list"),
    Object.entries(concernsData.concerns).map(([key, c]) => ({
      label: c.label,
      key,
      onSelect: (key, active) => {
        active ? selectedConcerns.add(key) : selectedConcerns.delete(key);
        FilterLists.setSelectedConcerns(selectedConcerns);
      },
    })),
    selectedConcerns
  );

  const functionOptions = buildSelectableList(
    document.getElementById("functions-list"),
    functionsData.map(fn => ({
      label: fn.label,
      key:   fn.label,
      onSelect: (key, active) => {
        active ? selectedFunctions.add(key) : selectedFunctions.delete(key);
        FilterLists.setSelectedFunctions(selectedFunctions);
      },
    })),
    selectedFunctions
  );

  /* Chosen-filter chips: one per checked Concern / Function, with an × that unchecks it.
     Also shows how many are chosen on each dropdown button, e.g. "Concerns (2)". */
  const activeFiltersEl = document.getElementById("active-filters");

  function renderActiveFilters() {
    activeFiltersEl.innerHTML = "";

    const groups = [
      { selected: selectedConcerns,  options: concernOptions,  countEl: document.getElementById("concerns-count") },
      { selected: selectedFunctions, options: functionOptions, countEl: document.getElementById("functions-count") },
    ];

    groups.forEach(({ selected, options, countEl }) => {
      countEl.textContent = `(${selected.size})`;
      countEl.hidden = selected.size === 0;

      selected.forEach(key => {
        const option = options.get(key);
        if (!option) return;

        const chip = document.createElement("span");
        chip.className = "active-filter-chip";
        chip.textContent = option.label;

        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "active-filter-remove";
        remove.setAttribute("aria-label", `Remove ${option.label}`);
        remove.textContent = "×";
        remove.addEventListener("click", () => {
          option.checkbox.checked = false; // keeps the dropdown's box in sync
          option.onSelect(key, false);
          filterProducts();
          renderActiveFilters();
        });

        chip.appendChild(remove);
        activeFiltersEl.appendChild(chip);
      });
    });

    const total = selectedConcerns.size + selectedFunctions.size;
    if (total > 1) {
      const clearAll = document.createElement("button");
      clearAll.type = "button";
      clearAll.className = "active-filters-clear";
      clearAll.textContent = "clear all";
      clearAll.addEventListener("click", () => {
        groups.forEach(({ selected, options }) => {
          [...selected].forEach(key => {
            const option = options.get(key);
            option.checkbox.checked = false;
            option.onSelect(key, false);
          });
        });
        filterProducts();
        renderActiveFilters();
      });
      activeFiltersEl.appendChild(clearAll);
    }

    activeFiltersEl.hidden = total === 0;
    renderChoicesSummary();
  }

  /* Sidebar reminder: for each chosen skin concern, the functions that help it (the concern's "gofor" list).
     This is only a reminder; the suggested functions are NOT applied to the results.
     Each suggestion is a button that ticks/unticks that function in the Functions filter. */
  const choicesSummaryEl = document.getElementById("choices-summary");

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text) node.textContent = text;
    return node;
  }

  function toggleFunction(key) {
    const option = functionOptions.get(key);
    if (!option) return;
    option.checkbox.checked = !option.checkbox.checked;
    option.onSelect(key, option.checkbox.checked);
    filterProducts();
    renderActiveFilters(); // also re-renders this reminder
  }

  function renderChoicesSummary() {
    choicesSummaryEl.innerHTML = "";

    if (!selectedConcerns.size) {
      choicesSummaryEl.append(
        el("h2", "choices-heading", "Discover products"),
        el("p", "choices-note", "Choose a skin concern from the Concerns filter and we'll remind you which functions help with it.")
      );
      return;
    }

    // Heading, then one box of labeled rows:  SKIN CONCERN | Acne   /   HELPFUL FUNCTIONS | [pills]
    choicesSummaryEl.append(
      el("span", "choices-eyebrow", "Reminder"),
      el("h2", "choices-heading", "Based on what you chose")
    );

    const box = el("dl", "choices-list");

    selectedConcerns.forEach(key => {
      const concern = concernsData.concerns[key];
      const group = el("div", "choices-group"); // one concern + its functions

      const concernEl = el("dd", "choices-concern", concern.label);
      concernEl.title = concern.label; // full name on hover, in case it's cut off with "..."
      group.append(el("dt", "", "Skin concern"), concernEl);

      const helpers = (concern.gofor || []).filter(g => g && functionOptions.has(g));
      if (helpers.length) {
        group.append(el("dt", "", "Helpful functions"));
        const list = el("dd", "choices-functions");
        helpers.forEach(g => {
          const active = selectedFunctions.has(g);
          // A checkbox-style toggle: small box + name, so it reads as "pick any number", not single select
          const btn = el("button", "choices-function" + (active ? " is-active" : ""));
          btn.type = "button";
          btn.setAttribute("role", "checkbox");
          btn.setAttribute("aria-checked", String(active));
          btn.append(el("span", "choices-check"), el("span", "choices-function-name", g));
          // Full name on hover (the pill may cut it off with "..."), plus what clicking does
          btn.title = `${g}: ` + (active ? "applied, click to remove from the Functions filter" : "click to add to the Functions filter");
          btn.addEventListener("click", () => toggleFunction(g));
          list.append(btn);
        });
        group.append(list);
      }

      box.append(group);
    });

    choicesSummaryEl.append(box);
    choicesSummaryEl.append(el("p", "choices-note",
      "These functions aren't applied to your results yet. Check as many as you like to narrow down products, or choose them from the Functions filter."));
  }

  renderActiveFilters(); // show any choices saved from a previous visit

  /* Resizable sidebar: drag the handle (or use arrow keys); the width is saved in localStorage.
     Double-click the handle to go back to the default width from the CSS. */
  const layoutEl     = document.querySelector(".catalog-layout");
  const sidebarEl    = document.querySelector(".catalog-sidebar");
  const resizerEl    = document.getElementById("sidebar-resizer");
  const WIDTH_KEY    = "catalogSidebarWidth";
  const MIN_WIDTH    = 220;
  const maxWidth     = () => Math.max(MIN_WIDTH, layoutEl.clientWidth * 0.5); // never more than half the screen
  const clampWidth   = w => Math.min(maxWidth(), Math.max(MIN_WIDTH, w));

  function setSidebarWidth(w) {
    sidebarEl.style.flexBasis = `${Math.round(clampWidth(w))}px`;
  }
  function saveSidebarWidth() {
    try { localStorage.setItem(WIDTH_KEY, String(sidebarEl.getBoundingClientRect().width)); } catch {}
  }

  try {
    const saved = Number(localStorage.getItem(WIDTH_KEY));
    if (saved) setSidebarWidth(saved);
  } catch {}

  resizerEl.addEventListener("pointerdown", e => {
    e.preventDefault();
    const startX = e.clientX;
    const startW = sidebarEl.getBoundingClientRect().width;
    resizerEl.setPointerCapture(e.pointerId);
    document.body.classList.add("is-resizing");

    const onMove = ev => setSidebarWidth(startW + (ev.clientX - startX));
    const onUp = () => {
      resizerEl.removeEventListener("pointermove", onMove);
      resizerEl.removeEventListener("pointerup", onUp);
      resizerEl.removeEventListener("pointercancel", onUp);
      document.body.classList.remove("is-resizing");
      saveSidebarWidth();
    };
    resizerEl.addEventListener("pointermove", onMove);
    resizerEl.addEventListener("pointerup", onUp);
    resizerEl.addEventListener("pointercancel", onUp);
  });

  resizerEl.addEventListener("keydown", e => {
    const step = e.shiftKey ? 60 : 20;
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    e.preventDefault();
    const w = sidebarEl.getBoundingClientRect().width;
    setSidebarWidth(w + (e.key === "ArrowRight" ? step : -step));
    saveSidebarWidth();
  });

  resizerEl.addEventListener("dblclick", () => {
    sidebarEl.style.flexBasis = "";
    try { localStorage.removeItem(WIDTH_KEY); } catch {}
  });

  // If the window shrinks, keep a custom width within the allowed range
  window.addEventListener("resize", () => {
    if (sidebarEl.style.flexBasis) setSidebarWidth(parseFloat(sidebarEl.style.flexBasis));
  });

  /* Filter bar dropdowns: only one open at a time, and clicking anywhere else closes them */
  const filterDropdowns = document.querySelectorAll(".filter-dropdown");
  filterDropdowns.forEach(d => d.addEventListener("toggle", () => {
    if (d.open) filterDropdowns.forEach(other => { if (other !== d) other.open = false; });
  }));
  document.addEventListener("click", e => {
    filterDropdowns.forEach(d => { if (!d.contains(e.target)) d.open = false; });
  });
</script>

<style>
  main {
    max-width: none;
    padding: 0;
  }

  /* Catalog only: <main> fills the whole screen (no padding), and the page itself never scrolls.
     Only the product box scrolls (see .product-grid). */
  body.main-scroll main {
    overflow: hidden;
    padding: 0;
  }

  .catalog-layout {
    --filter-control-height: 40px; /* dropdown buttons and every search bar (product, include, exclude) share this height */
    display: flex;
    width: 100%;
    height: 100%; /* exactly the space under the header, so nothing spills past the window */
  }

  /* Sidebar: full height, against the left edge of the screen.
     Default width follows the screen: 30% of it, but never narrower than 280px or wider than 440px.
     Dragging the resizer overrides this with a saved px width (inline flex-basis). */
  .catalog-sidebar {
    flex: 0 0 clamp(280px, 30%, 440px);
    display: flex;
    flex-direction: column;
    gap: var(--space-md);
    min-width: 0;
    min-height: 0;
    padding: var(--space-lg);
    background-color: var(--color-surface);
    overflow-y: auto; /* only scrolls if open sections make it taller than the window */
  }

  /* Resize handle: the sidebar's right border line, with a wider invisible grab area */
  .sidebar-resizer {
    flex: 0 0 8px;
    margin: 0 -4px; /* grab area overlaps both sides, so the layout doesn't shift */
    position: relative;
    z-index: 20;
    cursor: col-resize;
    touch-action: none;
    background: linear-gradient(#c9b8b4, #c9b8b4) center / 1.5px 100% no-repeat; /* same color as the sidebar dividers */
  }

  .sidebar-resizer:hover,
  .sidebar-resizer:focus-visible,
  body.is-resizing .sidebar-resizer {
    outline: none;
    background-size: 4px 100%;
    background-image: linear-gradient(var(--color-accent-checklist), var(--color-accent-checklist));
  }

  /* While dragging: no text selection, and the resize cursor everywhere */
  body.is-resizing {
    cursor: col-resize;
    user-select: none;
  }

  /* Small screens (phones): filters go on top, products underneath; no resizing */
  @media (max-width: 700px) {
    .catalog-layout {
      flex-direction: column;
    }

    .catalog-sidebar {
      flex: 0 1 auto !important; /* ignore a width saved from a bigger screen */
      max-height: 45%;
      border-bottom: 1.5px solid #c9b8b4;
    }

    .sidebar-resizer {
      display: none;
    }
  }

  .sidebar-block {
    display: flex;
    flex-direction: column;
    gap: var(--space-sm);
  }

  .sidebar-heading {
    margin: 0;
    font-size: var(--font-size-xl);
    font-weight: 700;
    color: var(--color-text);
    line-height: 1.1;
  }

  .sidebar-divider {
    border: none;
    border-top: 1px solid #c9b8b4;
    margin: 0;
  }

  /* Summary at the top of the sidebar */
  .sidebar-summary {
    display: flex;
    flex-direction: column;
    gap: var(--space-sm);
  }

  /* Small "REMINDER" label above everything */
  .choices-eyebrow {
    font-size: var(--font-size-xs);
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--color-accent-checklist);
  }

  /* Main message: same size and weight as the "Include Ingredients" headings */
  .choices-heading {
    margin: 0;
    font-size: var(--font-size-xl);
    font-weight: 700;
    line-height: 1.15;
    color: var(--color-text);
  }

  /* The box: green stripe on the left, light beige background */
  .choices-list {
    display: flex;
    flex-direction: column;
    margin: 0;
    padding: var(--space-md);
    border-left: 3px solid var(--color-accent-checklist); /* same green as a checked box */
    background-color: var(--color-bg);
    border-radius: 0 var(--radius-md) var(--radius-md) 0;
  }

  /* One concern + its functions: small muted label on the left, value on the right */
  .choices-group {
    display: grid;
    /* Fixed label column + a value column that can't grow past the box, so long text gets "..." instead */
    grid-template-columns: 80px minmax(0, 1fr);
    column-gap: var(--space-lg); /* space between the labels and their values */
    row-gap: var(--space-sm);
    align-items: start; /* each label lines up with the top of its value */
  }

  /* More than one concern: a thin line between them */
  .choices-group + .choices-group {
    margin-top: var(--space-md);
    padding-top: var(--space-md);
    border-top: 1px solid #c9b8b4; /* same color as the sidebar dividers */
  }

  .choices-list dt {
    font-size: var(--font-size-xs);
    font-weight: 700;
    letter-spacing: 0.05em;
    line-height: 1.3;
    text-transform: uppercase;
    color: var(--color-text-muted);
    overflow-wrap: break-word; /* "HELPFUL FUNCTIONS" sits on two short lines in the 80px column */
  }

  .choices-list dd {
    margin: 0;
