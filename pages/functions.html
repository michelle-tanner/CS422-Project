<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Functions — MySkindex</title>
  <link rel="stylesheet" href="../index.css" />
  <script src="../components/header.js" defer></script>
  <script src="../components/footer.js" defer></script>
  <script src="../components/dropdown.js" defer></script>
  <script src="../data/ingredient-lists.js" defer></script> 
  <script src="../components/pill.js" defer></script>
</head>
<body>

  <my-header></my-header>

  <main>
    <div class="function-toggle" role="group" aria-label="Which functions to show">
      <button type="button" class="toggle-side" data-side="main" aria-pressed="true">active functions</button>
      <button type="button" class="toggle-side" data-side="other" aria-pressed="false">inactive functions</button>
    </div>

    <!-- One <function-dropdown> per function gets added here by renderFunctions() below -->
    <div class="function-list"></div>
  </main>

  <my-footer></my-footer>

  <!-- MOCK DATA: defines the starting include/exclude choices for the pills. -->
  <script src="../data/mock-data.js"></script>

  <script>
    // Builds one <function-dropdown> for each function in the list and adds it to the page.
    // Each function looks like: { label, color, description, ingredients: ["...", "..."] }
    function renderFunctions(functions) {
      const list = document.querySelector(".function-list");
      list.innerHTML = ""; // clear anything already there

      functions.forEach((fn) => {
        const dropdown = document.createElement("function-dropdown");
        // setAttribute is safe: the text is never read as HTML
        dropdown.setAttribute("function-label", fn.label);
        if (fn.color) dropdown.setAttribute("color", fn.color); // no color -> the dropdown uses gray
        dropdown.setAttribute("description", fn.description);
        dropdown.setAttribute("ingredients", JSON.stringify(fn.ingredients)); // attributes only hold text, so turn the list into JSON
        list.appendChild(dropdown);
      });
    }

    // Which functions in functions.json count as "active", and each one's color.
    // Edit this list to regroup or recolor them. Anything not listed is "inactive" and shows in gray.
    const ACTIVE_FUNCTION_COLORS = {
      // green: hydrates, calms, or protects
      "moisturizer/humectant": "var(--color-function-green)",
      "emollient": "var(--color-function-green)",
      "soothing": "var(--color-function-green)",
      "skin-identical ingredient": "var(--color-function-green)",
      "antioxidant": "var(--color-function-green)",
      "cell-communicating ingredient": "var(--color-function-green)",
      "sunscreen": "var(--color-function-green)",
      // blue: treats or exfoliates
      "exfoliant": "var(--color-function-blue)",
      "abrasive/scrub": "var(--color-function-blue)",
      "anti-acne": "var(--color-function-blue)",
      "skin brightening": "var(--color-function-blue)",
      "absorbent/mattifier": "var(--color-function-blue)",
      "antimicrobial/antibacterial": "var(--color-function-blue)",
      "astringent": "var(--color-function-blue)",
      // red: can irritate
      "perfuming": "var(--color-function-red)",
    };

    let activeFunctions = [];
    let inactiveFunctions = [];

    // Toggle: "Active functions" (left) shows activeFunctions, "Inactive functions" (right) shows inactiveFunctions.
    const toggle = document.querySelector(".function-toggle");

    function showSide(side) {
      toggle.querySelectorAll(".toggle-side").forEach((button) => {
        button.setAttribute("aria-pressed", String(button.dataset.side === side));
      });
      toggle.dataset.side = side; 

      renderFunctions(side === "other" ? inactiveFunctions : activeFunctions);
    }

    toggle.addEventListener("click", (event) => {
      const button = event.target.closest(".toggle-side");
      if (button) showSide(button.dataset.side);
    });

    // Load the real functions, sort them into the two groups, and show the active ones.
    fetch("../data/functions.json")
      .then((res) => {
        if (!res.ok) throw new Error(`Couldn't load functions.json (${res.status})`);
        return res.json();
      })
      .then((functions) => {
        activeFunctions = functions
          .filter((fn) => fn.label in ACTIVE_FUNCTION_COLORS)
          .map((fn) => ({ ...fn, color: ACTIVE_FUNCTION_COLORS[fn.label] }));
        inactiveFunctions = functions.filter((fn) => !(fn.label in ACTIVE_FUNCTION_COLORS));
        showSide("main");
      })
      .catch((error) => {
        console.error(error);
        document.querySelector(".function-list").textContent = "Functions couldn't be loaded. Please try again.";
      });
  </script>

</body>
</html>

<style>
  main {
    max-width: none;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .function-list {
    width: 100%;
  }

  /* The real data is all lowercase, so capitalize the first letter when showing it */
  function-dropdown .dropdown-toggle > span:first-child::first-letter,
  ingredient-pill .pill-label::first-letter {
    text-transform: uppercase;
  }

  /* ---- TOGGLE ---- */
  /* the track: a rounded bar split into two equal halves, one per word */
  .function-toggle {
    position: relative;
    display: grid;
    grid-template-columns: 1fr 1fr; 
    padding: 3px; /* room for the outline */
    margin: var(--space-xl) var(--space-xl);
    box-shadow: inset 0 0 0 3px var(--color-border-dark);
    border-radius: var(--radius-pill);
    background-color: var(--color-bg);
  }

  /* the highlight that sits behind the picked word and slides between sides */
  .function-toggle::before {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    width: 50%;
    border-radius: var(--radius-pill);
    background-color: var(--color-border-dark); 
    transition: transform 0.3s;
  }

  /* right side picked: slide the highlight over */
  .function-toggle[data-side="other"]::before {
    transform: translateX(100%);
  }

  /* text */ 
  .toggle-side {
    position: relative;
    padding: var(--space-sm) var(--space-md);
    border: none;
    border-radius: var(--radius-pill);
    background: none;
    color: var(--color-text);
    font-family: var(--font-base);
    font-size: var(--font-size-lg);
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
    transition: color 0.2s;
  }

  .toggle-side[aria-pressed="true"] {
    color: var(--color-bg);
  }

  /* keyboard tabbing */
  .toggle-side:focus-visible {
    outline: 2px solid var(--color-border-dark);
  }
</style>
