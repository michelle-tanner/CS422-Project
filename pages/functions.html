<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Functions — MySkindex</title>
  <link rel="stylesheet" href="../index.css" />
  <script src="../components/header.js" defer></script>
  <script src="../components/footer.js" defer></script>
  <script src="../components/dropdown.js" defer></script>
  <script src="../data/filter-lists.js" defer></script> 
  <script src="../components/pill.js" defer></script>
</head>
<body>

  <my-header></my-header>

  <main>
    <div class="function-toggle" role="group" aria-label="Which functions to show">
      <button type="button" class="toggle-side" data-side="main" aria-pressed="true">active functions <span class="toggle-count"></span></button>
      <button type="button" class="toggle-side" data-side="other" aria-pressed="false">inactive functions <span class="toggle-count"></span></button>
    </div>

    <!-- One list per tab. Each is filled with <function-dropdown>s by renderFunctions() the first time it's shown -->
    <div class="function-list" data-side="main"></div>
    <div class="function-list" data-side="other" hidden></div>
  </main>


  <script>
    // Builds one <function-dropdown> for each function in the list and adds it to the page.
    // Each function looks like: { label, color, description, ingredients: ["...", "..."] }
    function renderFunctions(functions, list) {
      functions.forEach((fn) => {
        const dropdown = document.createElement("function-dropdown");
        // setAttribute is safe: the text is never read as HTML
        dropdown.setAttribute("function-label", fn.label);
        if (fn.color) dropdown.setAttribute("color", fn.color); // no color -> the dropdown uses gray
        dropdown.setAttribute("description", fn.description);
        dropdown.setAttribute("ingredients", JSON.stringify(fn.ingredients)); // attributes only hold text, so turn the list into JSON
        list.appendChild(dropdown);
      });
    }

    // Each group in concerns.json and the color its functions show in.
    const CONCERN_GROUP_COLORS = {
      gofor: "var(--color-function-green)",
      thesehelp: "var(--color-function-blue)",
      avoid: "var(--color-function-red)",
    };

    // Only used when no skin concern is selected: which functions count as "active", and their colors.
    // Anything not listed is "inactive" and shows in gray.
    const ACTIVE_FUNCTION_COLORS = {
      // green: hydrates, calms, or protects
      "moisturizer/humectant": "var(--color-function-green)",
      "emollient": "var(--color-function-green)",
      "soothing": "var(--color-function-green)",
      "skin-identical ingredient": "var(--color-function-green)",
      "antioxidant": "var(--color-function-green)",
      "cell-communicating ingredient": "var(--color-function-green)",
      "sunscreen": "var(--color-function-green)",
      // blue: treats or exfoliates
      "exfoliant": "var(--color-function-blue)",
      "abrasive/scrub": "var(--color-function-blue)",
      "anti-acne": "var(--color-function-blue)",
      "skin brightening": "var(--color-function-blue)",
      "absorbent/mattifier": "var(--color-function-blue)",
      "antimicrobial/antibacterial": "var(--color-function-blue)",
      "astringent": "var(--color-function-blue)",
      // red: can irritate
      "perfuming": "var(--color-function-red)",
    };

    let activeFunctions = [];
    let inactiveFunctions = [];

    // Toggle: "Active functions" (left) shows activeFunctions, "Inactive functions" (right) shows inactiveFunctions.
    const toggle = document.querySelector(".function-toggle");

    function showSide(side) {
      toggle.querySelectorAll(".toggle-side").forEach((button) => {
        button.setAttribute("aria-pressed", String(button.dataset.side === side));
      });
      toggle.dataset.side = side; 

      // Each tab is built once, then just hidden or shown
      document.querySelectorAll(".function-list").forEach((list) => {
        list.hidden = list.dataset.side !== side;
        if (!list.hidden && !list.hasChildNodes()) {
          renderFunctions(side === "other" ? inactiveFunctions : activeFunctions, list);
        }
      });
    }

    toggle.addEventListener("click", (event) => {
      const button = event.target.closest(".toggle-side");
      if (button) showSide(button.dataset.side);
    });

    function loadJson(url) {
      return fetch(url).then((res) => {
        if (!res.ok) throw new Error(`Couldn't load ${url} (${res.status})`);
        return res.json();
      });
    }

    // Active = the concern's Go For, These Help, and Avoid functions, in that order.
    function getConcernFunctions(functions, concern) {
      return Object.entries(CONCERN_GROUP_COLORS).flatMap(([group, color]) =>
        functions
          .filter((fn) => concern[group].includes(fn.label))
          .map((fn) => ({ ...fn, color }))
      );
    }

    function getDefaultFunctions(functions) {
      return functions
        .filter((fn) => fn.label in ACTIVE_FUNCTION_COLORS)
        .map((fn) => ({ ...fn, color: ACTIVE_FUNCTION_COLORS[fn.label] }));
    }

    // Waits for DOMContentLoaded because FilterLists comes from a deferred script.
    document.addEventListener("DOMContentLoaded", () => {
      Promise.all([loadJson("../data/functions.json"), loadJson("../data/concerns.json")])
        .then(([functions, { concerns }]) => {
          const concern = concerns[FilterLists.getSelectedConcern()];
          activeFunctions = concern ? getConcernFunctions(functions, concern) : getDefaultFunctions(functions);

          // Inactive = everything in functions.json that isn't active.
          const activeLabels = new Set(activeFunctions.map((fn) => fn.label));
          inactiveFunctions = functions.filter((fn) => !activeLabels.has(fn.label));

          // Show how many functions are in each tab
          toggle.querySelector('[data-side="main"] .toggle-count').textContent = activeFunctions.length;
          toggle.querySelector('[data-side="other"] .toggle-count').textContent = inactiveFunctions.length;

          showSide("main");
        })
        .catch((error) => {
          console.error(error);
          document.querySelector(".function-list").textContent = "Functions couldn't be loaded. Please try again.";
        });
    });
  </script>

</body>
</html>

<style>
  main {
    max-width: none;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .function-list {
    width: 100%;
  }

  /* The real data is all lowercase, so capitalize the first letter when showing it */
  function-dropdown .dropdown-toggle > span:first-child::first-letter,
  ingredient-pill .pill-label::first-letter {
    text-transform: uppercase;
  }

  /* ---- TOGGLE ---- */
  /* the track: a rounded bar split into two equal halves, one per word */
  .function-toggle {
    position: relative;
    display: grid;
    grid-template-columns: 1fr 1fr; 
    padding: 3px; /* room for the outline */
    margin: var(--space-xl) var(--space-xl);
    box-shadow: inset 0 0 0 3px var(--color-border-dark);
    border-radius: var(--radius-pill);
    background-color: var(--color-bg);
  }

  /* the highlight that sits behind the picked word and slides between sides */
  .function-toggle::before {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    width: 50%;
    border-radius: var(--radius-pill);
    background-color: var(--color-border-dark); 
    transition: transform 0.3s;
  }

  /* right side picked: slide the highlight over */
  .function-toggle[data-side="other"]::before {
    transform: translateX(100%);
  }

  /* text */ 
  .toggle-side {
    position: relative;
    display: flex;
    align-items: center; /* lines up the text and the count circle */
    justify-content: center;
    padding: var(--space-sm) var(--space-md);
    border: none;
    border-radius: var(--radius-pill);
    background: none;
    color: var(--color-text);
    font-family: var(--font-base);
    font-size: var(--font-size-lg);
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
    transition: color 0.2s;
  }

  .toggle-side[aria-pressed="true"] {
    color: var(--color-bg);
  }

  /* count: a little circle in the opposite colors of the tab's text */
  .toggle-count {
    display: inline-grid;
    place-items: center;
    width: 24px;
    height: 24px;
    margin-left: var(--space-sm);
    border-radius: 50%;
    background-color: var(--color-border-dark);
    color: var(--color-bg);
    font-size: var(--font-size-sm);
    line-height: 1;
    transition: background-color 0.2s, color 0.2s;
  }

  .toggle-count:empty {
    display: none; /* no circle until the count has loaded */
  }

  .toggle-side[aria-pressed="true"] .toggle-count {
    background-color: var(--color-bg);
    color: var(--color-border-dark);
  }

  /* keyboard tabbing */
  .toggle-side:focus-visible {
    outline: 2px solid var(--color-border-dark);
  }
</style>
