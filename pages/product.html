<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Product — MySkindex</title>
  <link rel="stylesheet" href="../index.css" />
  <script src="../data/filter-lists.js" defer></script>
  <script src="../components/pill.js" defer></script>
  <script src="../components/header.js" defer></script>
  <script src="../components/footer.js" defer></script>
  <script src="../components/breadcrumb.js" defer></script>
</head>
<body class="main-scroll">

  <my-header></my-header>
  <my-breadcrumb current="product"></my-breadcrumb>

  <main>
    <div class="product-layout">

      <!-- TOP: image + product info side by side -->
      <div class="top-row">
        <img class="product-image" src="" alt="" />
        <div class="product-info">
          <p class="product-type"></p>
          <h1 class="product-name"></h1>
          <p class="description"></p>
        </div>
      </div>

      <hr class="section-divider" />

      <!-- BOTTOM: ingredients overview (left) + detail panel (right) -->
      <div class="bottom-row">
        <div class="ingredients-overview">
          <h2 class="section-heading">Ingredients Overview</h2>
          <div class="overview-pills" id="overview-pills"></div>
        </div>

        <div class="vertical-divider"></div>

        <div class="ingredient-panel" id="ingredient-panel">
          <p class="panel-placeholder">Click on an ingredient to learn more!</p>
        </div>
      </div>

    </div>
  </main>

  <my-footer></my-footer>

</body>
</html>

<script type="module">
  const productName = new URLSearchParams(window.location.search).get("name");

  if (productName) {
    const [products, ingredientsData] = await Promise.all([
      fetch("../data/products.json").then(r => r.json()),
      fetch("../data/ingredients.json").then(r => r.json()),
    ]);

    const product = products.find(p => p.name === productName);

    if (product) {

    // Build ingredient lookup map (lowercase name → ingredient data)
    const ingredientMap = new Map(ingredientsData.map(i => [i.name.toLowerCase(), i]));

    /* Populate product info */
    document.title = `${product.name} — MySkindex`;
    document.querySelector(".product-image").src = product.image || "";
    document.querySelector(".product-image").alt = product.name;
    document.querySelector(".product-name").textContent = product.name;
    document.querySelector(".product-type").textContent = product.type ?? "";
    document.querySelector(".description").textContent  = product.desc ?? "";

    /* Ingredient rating → pill color + display name */
    function ratingClass(rating) {
      if (rating === "Safe")            return "pill-safe";
      if (rating === "Safe (in low %)") return "pill-moderate";
      if (rating === "Moderate Risk")   return "pill-bad";
      return "pill-unknown";
    }

    function ratingLabel(rating) {
      if (rating === "Safe")            return "Safe";
      if (rating === "Safe (in low %)") return "Neutral";
      if (rating === "Moderate Risk")   return "Icky";
      return "Unknown";
    }

    /* Ingredient detail panel */
    const panel = document.getElementById("ingredient-panel");

    function showIngredient(ingred) {
      const rating = ingred.rating || "";
      panel.innerHTML = `
        <div class="panel-content">
          <h3 class="panel-name">${ingred.name}</h3>
          <div class="panel-functions">
            ${(ingred.function || []).map(f => `<span class="fn-tag">${f}</span>`).join("")}
          </div>
          <span class="panel-rating ${ratingClass(rating)}">${ratingLabel(rating)}</span>
          <p class="panel-desc">${ingred.description || ""}</p>
        </div>
      `;
    }

    /* Render overview pills */
    const overviewEl = document.getElementById("overview-pills");
    (product.ingreds || []).forEach(name => {
      const ingred = ingredientMap.get(name.toLowerCase());
      const rating = ingred?.rating || "";

      const pill = document.createElement("button");
      pill.type = "button";
      pill.className = `overview-pill ${ratingClass(rating)}`;
      pill.textContent = name;
      pill.addEventListener("click", () => {
        document.querySelectorAll(".overview-pill").forEach(p => p.classList.remove("active"));
        pill.classList.add("active");
        showIngredient(ingred || { name, rating: "", function: [], description: "No information available." });
      });
      overviewEl.appendChild(pill);
    });
    } // end if (product)
  } // end if (productName)
</script>

<style>
  main {
    padding: var(--space-lg) var(--space-md);
  }

  .product-layout {
    display: flex;
    flex-direction: column;
    gap: 0;
    max-width: var(--max-width);
    margin: 0 auto;
  }

  /* Top row: image + product info */
  .top-row {
    display: flex;
    gap: var(--space-xl);
    align-items: flex-start;
    padding-bottom: var(--space-xl);
  }

  .product-image {
    width: 280px;
    height: 280px;
    flex-shrink: 0;
    object-fit: cover;
    border-radius: var(--radius-md);
    background: var(--color-bg);
    display: block;
  }

  .product-info {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: var(--space-xs);
  }

  .product-type {
    margin: 0;
    font-size: var(--font-size-sm);
    color: var(--color-text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .product-name {
    margin: 0;
    font-size: var(--font-size-2xl);
    font-weight: 800;
    color: var(--color-text);
  }


  .description {
    margin: var(--space-sm) 0 0;
    color: var(--color-text-muted);
    line-height: 1.6;
  }

  /* Horizontal divider between top and bottom */
  .section-divider {
    border: none;
    border-top: 2px solid rgba(0, 0, 0, 0.15);
    margin: 0;
  }

  /* Bottom row: ingredients overview + detail panel */
  .bottom-row {
    display: flex;
    gap: 0;
    align-items: flex-start;
    padding-top: var(--space-xl);
  }

  .ingredients-overview {
    flex: 1;
    padding-right: var(--space-xl);
  }

  .section-heading {
    font-size: var(--font-size-lg);
    font-weight: 700;
    margin: 0 0 var(--space-md);
    color: var(--color-text);
  }

  .overview-pills {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-xs);
  }

  /* Overview pill buttons */
  .overview-pill {
    padding: 4px 12px;
    border-radius: var(--radius-pill);
    border: 2px solid transparent;
    font-size: 0.75rem;
    font-weight: 600;
    cursor: pointer;
    transition: border-color 0.15s, opacity 0.15s;
  }

  .overview-pill:hover  { opacity: 0.8; }
  .overview-pill.active { border-color: var(--color-text); }

  .pill-safe     { background: var(--color-function-green); color: #fff; }
  .pill-moderate { background: var(--color-function-blue);  color: #fff; }
  .pill-bad      { background: var(--color-function-red);   color: #fff; }
  .pill-unknown  { background: var(--color-function-gray);  color: #fff; }

  /* Vertical divider between overview and detail panel */
  .vertical-divider {
    width: 2px;
    align-self: stretch;
    background: rgba(0, 0, 0, 0.15);
    flex-shrink: 0;
  }

  /* Ingredient detail panel */
  .ingredient-panel {
    flex: 0 0 300px;
    padding: var(--space-lg) var(--space-lg) var(--space-lg) var(--space-xl);
    min-height: 200px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .panel-placeholder {
    color: var(--color-text-muted);
    font-size: var(--font-size-base);
    font-style: italic;
    text-align: center;
    margin: 0;
  }

  .panel-content {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: var(--space-sm);
  }

  .panel-name {
    margin: 0;
    font-size: var(--font-size-xl);
    font-weight: 800;
    color: var(--color-text);
    text-transform: capitalize;
  }

  .panel-functions {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-xs);
  }

  .fn-tag {
    display: inline-block;
    padding: 3px 10px;
    border-radius: var(--radius-pill);
    background: var(--color-accent-pill);
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--color-text);
    text-transform: capitalize;
  }

  .panel-rating {
    display: inline-block;
    padding: 4px 14px;
    border-radius: var(--radius-pill);
    font-size: var(--font-size-sm);
    font-weight: 700;
    color: #fff;
    align-self: flex-start;
  }

  .panel-desc {
    margin: 0;
    color: var(--color-text-muted);
    line-height: 1.6;
  }
</style>
